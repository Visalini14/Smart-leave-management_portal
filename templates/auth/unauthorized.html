{% extends "base.html" %}
{% block title %}Access Denied - 403{% endblock %}
{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <div style="font-size: 4rem; color: var(--danger);"><i class="fa-solid fa-lock"></i></div>
    <h2 style="margin-top: 16px; font-size: 1.8rem;">403 - Access Denied</h2>
    <p style="color: var(--text-muted); margin-top: 8px;">You do not have permission to view or manage this resource.</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary" style="margin-top: 24px;">Return to Portal Home</a>
</div>
{% endblock %}
