{% extends "base.html" %}
{% block title %}Page Not Found - 404{% endblock %}
{% block content %}
<div style="text-align: center; padding: 60px 20px;">
    <div style="font-size: 4rem; color: var(--warning);"><i class="fa-solid fa-compass"></i></div>
    <h2 style="margin-top: 16px; font-size: 1.8rem;">404 - Page Not Found</h2>
    <p style="color: var(--text-muted); margin-top: 8px;">The requested portal page could not be located.</p>
    <a href="{{ url_for('auth.index') }}" class="btn btn-primary" style="margin-top: 24px;">Return Home</a>
</div>
{% endblock %}
